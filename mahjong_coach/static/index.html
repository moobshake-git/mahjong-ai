<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn Coach</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
  /* 中 Zhong theme: vermilion on ivory, one clear call. */
  :root {
    --bg: #F7F1E6; --panel: #FFFFFF; --ink: #1A1714; --muted: #5E574E; --line: #D9CFBE;
    --tile: #FFFDF7; --tile-edge: #CFC8B6; --accent: #C8281E; --accent-deep: #8F1B14; --accent-ink: #FFFFFF;
    --warn-bg: #FBE7D3; --warn-ink: #7A3A0A; --good: #1E6B4A; --bad: #B3261E;
    --m: #B4372A; --p: #2B5FA8; --s: #2F7D3A; --z: #1A1714; --sel: #FBEDEA;
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15110E; --panel: #211B17; --ink: #F3ECE2; --muted: #B3A99C; --line: #3A322B;
      --tile: #2A231E; --tile-edge: #4A4038; --accent: #E2554A; --accent-deep: #7A1A13; --accent-ink: #15110E;
      --warn-bg: #3A2412; --warn-ink: #F5C08A; --good: #7FD1A8; --bad: #F08A80;
      --m: #F08C7E; --p: #8DB4F0; --s: #86C98F; --z: #F3ECE2; --sel: #3A1F1B;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 40px; height: 47px; display: block; }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  header .grow { flex: 1; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  h2 { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  select, input[type=number] { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-height: 36px; }
  input[type=number] { width: 60px; }
  input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 12px; padding: 8px 14px; font-weight: 700; min-height: 44px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.quiet { border: 1px solid var(--line); font-weight: 600; min-height: 36px; padding: 6px 12px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 600; min-height: 36px; }
  .tab[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .tile { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 40px; height: 54px; border-radius: 6px; background: var(--tile); border: 1px solid var(--tile-edge);
    box-shadow: 0 2px 0 var(--tile-edge); padding: 0; color: var(--z); line-height: 1; font-family: var(--sans); }
  .tile b { font-size: 19px; font-weight: 800; }
  .tile i { font-style: normal; font-size: 12px; margin-top: 3px; font-family: var(--han); }
  .tile.z b { font-family: var(--han); font-weight: 900; }
  .tile.m { color: var(--m); } .tile.p { color: var(--p); } .tile.s { color: var(--s); }
  .tile.z7 { color: var(--accent); } .tile.z6 { color: var(--s); } .tile.z5 { color: var(--p); }
  .tile.small { width: 30px; height: 40px; } .tile.small b { font-size: 14px; } .tile.small i { font-size: 10px; }
  .tile.big { width: 52px; height: 70px; border-radius: 8px; box-shadow: 0 3px 0 var(--tile-edge); }
  .tile.big b { font-size: 30px; } .tile.big i { font-size: 15px; }
  .tile.big.key { border: 2px solid var(--accent); box-shadow: 0 3px 0 var(--accent-deep); }
  .tile .left { position: absolute; top: -7px; right: -8px; background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 700;
    border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; font-family: var(--sans); }
  .tile.dead { opacity: .35; }
  .tile:disabled { opacity: .3; cursor: default; }
  .tile.hl { outline: 2px solid var(--accent); outline-offset: 1px; }
  .palette .suit { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .hand { min-height: 58px; gap: 4px; }
  .slot { display: flex; align-items: center; gap: 6px; }
  .meld { display: inline-flex; gap: 1px; padding: 3px; border: 1px dashed var(--line); border-radius: 8px; align-items: center; }
  .meld .x { border: 0; background: none; color: var(--muted); padding: 0 6px; min-height: 32px; }

  .bonus-pick { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none;
    color: var(--muted); font-size: 11px; padding: 2px; width: 62px; hyphens: manual; text-align: center; }
  .bonus-pick:disabled { opacity: .35; cursor: default; }
  .btile { position: relative; display: inline-grid; place-items: center; width: 46px; height: 60px; border-radius: 6px;
    background: var(--tile); border: 1px solid var(--tile-edge); box-shadow: 0 2px 0 var(--tile-edge); padding: 0; }
  .btile svg { width: 34px; height: 34px; }
  .btile .num { position: absolute; top: 3px; left: 4px; font-size: 11px; font-weight: 700; line-height: 1; }
  .btile .num.f { color: var(--m); } .btile .num.s { color: var(--p); }
  .btile .tai { position: absolute; top: -7px; right: -7px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px; }
  .btile.small { width: 34px; height: 44px; } .btile.small svg { width: 26px; height: 26px; }
  .bonus-group { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .bonus-group h3 { width: 100%; margin: 4px 0 0; font-size: 12px; font-weight: 700; color: var(--muted); }

  /* The best-move card: the centre of the screen. */
  .hero { background: var(--panel); border: 3px solid var(--accent); border-radius: 24px; box-shadow: 0 6px 0 var(--accent-deep);
    padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .hero.idle { border: 1px solid var(--line); box-shadow: none; }
  .hero .kicker { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: var(--accent); }
  .hero.idle .kicker { color: var(--muted); }
  .hero .tiles { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .hero .verb { margin: 0; font-size: 60px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; color: var(--ink); text-transform: none; }
  .hero .sub { margin: 0; font-size: 17px; font-weight: 600; }
  .hero .rule { width: 48px; height: 3px; background: var(--accent); border-radius: 2px; }
  .hero .why { margin: 0; color: var(--muted); max-width: 36ch; font-size: 15px; }
  .hero .badge { margin-top: 2px; }
  .watch { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 12px; margin-top: 4px; }
  .watch .label { font-size: 13px; color: var(--muted); }
  .cta { display: flex; gap: 10px; width: 100%; margin-top: 6px; }
  .cta .btn { flex: 1 1 0; min-height: 54px; border-radius: 14px; font-size: 16px; }
  .cta .btn.primary { flex: 2 1 0; font-size: 17px; font-weight: 800; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 12px; font-size: 14px; text-align: left; width: 100%; }
  .others { width: 100%; text-align: left; margin-top: 4px; }
  .opt { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .opt-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .opt-title { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .needs { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .need { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .need .pay { color: var(--good); font-weight: 700; } .need .nopay { color: var(--bad); }
  .badge { font-size: 12px; border-radius: 999px; padding: 3px 10px; border: 1px solid var(--line); color: var(--muted); }
  .badge.jev { border-color: var(--accent); color: var(--accent); }
  .err { color: var(--bad); margin: 0; }
  .count { font-variant-numeric: tabular-nums; letter-spacing: 0; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .settings .row { gap: 10px 14px; margin-top: 10px; }
  @media (max-width: 520px) {
    main { padding: 12px 12px 40px; } section { padding: 12px; }
    .tile { width: 30px; height: 44px; } .tile b { font-size: 15px; } .tile i { font-size: 10px; }
    .tile.big { width: 46px; height: 62px; } .tile.big b { font-size: 26px; }
    .palette .suit { gap: 3px; }
    .hero .verb { font-size: 52px; }
    header .pill { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="/logo.svg" alt="" width="40" height="47">
    <h1>Turn Coach</h1>
    <span class="grow"></span>
    <span class="pill" id="engine">Singapore rules</span>
  </header>

  <div class="hero idle" id="advice" aria-live="polite">
    <div class="kicker">START HERE</div>
    <p class="why">Tap your 13 tiles below.</p>
  </div>

  <section>
    <h2>Your tiles <span class="count" id="handCount"></span></h2>
    <div class="row hand" id="hand"></div>
    <div class="row" style="margin-top:10px; gap:14px">
      <div class="slot"><span class="muted">Drew</span><span id="drawn"></span></div>
      <div class="slot"><span class="muted">Thrown</span><span id="thrown"></span>
        <label><input type="checkbox" id="fromLeft"> from player on my left</label></div>
    </div>
    <div class="row" id="melds" style="margin-top:8px"></div>
    <div class="row" id="bonus" style="margin-top:8px"></div>
  </section>

  <section>
    <div class="tabs" role="group" aria-label="Where tapped tiles go">
      <button class="tab" data-target="hand">My hand</button>
      <button class="tab" data-target="drawn">I drew</button>
      <button class="tab" data-target="thrown">Thrown</button>
      <button class="tab" data-target="seen">Seen elsewhere</button>
      <button class="tab" data-target="bonus">Flowers / animals</button>
    </div>
    <div class="palette" id="palette"></div>
    <div id="bonusPalette" hidden></div>
    <p class="muted" id="bonusHint" hidden></p>
    <details style="margin-top:6px"><summary>Seen elsewhere (<span id="seenCount">0</span>), tap to remove</summary>
      <div class="row" id="seen" style="margin-top:6px"></div></details>
  </section>

  <section class="settings">
    <div class="row" style="margin-top:0">
      <h2 style="margin:0">Table</h2>
      <span class="grow" style="flex:1"></span>
      <button class="btn quiet" id="undo" title="Undo last change">Undo</button>
      <button class="btn quiet" id="reset">New hand</button>
    </div>
    <div class="row">
      <label>Seat <select id="seat"><option>E</option><option>S</option><option>W</option><option>N</option></select></label>
      <label>Prevailing <select id="round"><option>E</option><option>S</option><option>W</option><option>N</option></select></label>
      <label>Min tai <input id="minTai" type="number" min="0" max="5" value="1"></label>
      <label>Cap <input id="maxTai" type="number" min="1" max="13" value="5"></label>
      <label><input id="useJev" type="checkbox" checked> Ask Jev</label>
    </div>
  </section>
</main>

<script>
const SUITS = { m: "萬", p: "筒", s: "索" };
const HONORS = ["東", "南", "西", "北", "白", "發", "中"];
const HONOR_NAMES = ["East wind", "South wind", "West wind", "North wind", "White dragon", "Green dragon", "Red dragon"];
const SUIT_NAMES = { m: "Characters", p: "Dots", s: "Bamboo" };
// Bonus tiles: [id, name, group]. Flowers and seasons carry a number 1-4 matching seats E, S, W, N.
const BONUS = [["f1","Plum","f"],["f2","Orchid","f"],["f3","Chrysanthemum","f"],["f4","Bamboo","f"],
               ["s1","Spring","s"],["s2","Summer","s"],["s3","Autumn","s"],["s4","Winter","s"],
               ["cat","Cat","a"],["rat","Rat","a"],["rooster","Rooster","a"],["centipede","Centipede","a"]];
// Original line art for each bonus tile, drawn on a 32x32 grid.
const petals = (n, rx, ry, cy, fill) => Array.from({ length: n }, (_, i) =>
  `<ellipse cx="16" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" transform="rotate(${i * 360 / n} 16 16)"/>`).join("");
const centipedeArt = (() => {
  const segs = [[7,25],[10.5,22.2],[14,19.6],[17.5,17],[21,14.4],[24.5,11.8]];
  const legs = segs.map(([x, y]) => `M${x + 1.4} ${y + 1.9}l1.6 2.2M${x - 1.4} ${y - 1.9}l-1.6 -2.2`).join("");
  return `<path d="${legs}" stroke="#8a4a1f" stroke-width="1.2" stroke-linecap="round"/>`
    + segs.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2.7" fill="${i % 2 ? "#b8562a" : "#d9772f"}"/>`).join("")
    + `<circle cx="27.6" cy="8.6" r="3" fill="#a3372a"/><circle cx="28.4" cy="7.8" r=".8" fill="#fff"/>`
    + `<path d="M29 6.2q1-3 3-3.4M26.6 6q-.4-3.2 1-4.6" stroke="#8a4a1f" stroke-width="1" fill="none" stroke-linecap="round"/>`;
})();
const orchidPetal = (deg, rx, ry, fill) =>
  `<g transform="rotate(${deg} 16 14)"><ellipse cx="16" cy="7" rx="${rx}" ry="${ry}" fill="${fill}"/></g>`;
const BONUS_ART = {
  f1: `<path d="M3 30Q9 22 14 19" stroke="#6b4a2f" stroke-width="2" fill="none" stroke-linecap="round"/>`
    + [[16,9],[22.7,13.8],[20.1,21.7],[11.9,21.7],[9.3,13.8]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#e86a92"/>`).join("")
    + `<circle cx="16" cy="16" r="3.2" fill="#f6c945"/>`,
  f2: `<path d="M16 31C16 26 15 22 16 18" stroke="#3f8f4a" stroke-width="2" fill="none"/>`
    + `<path d="M16 30C10 27 6 22 5 15" stroke="#4fa356" stroke-width="1.6" fill="none"/>`
    + orchidPetal(144, 2.6, 6, "#c9a6ec") + orchidPetal(-144, 2.6, 6, "#c9a6ec")
    + orchidPetal(0, 3.2, 6.5, "#9b6bd1") + orchidPetal(72, 3, 6.2, "#9b6bd1") + orchidPetal(-72, 3, 6.2, "#9b6bd1")
    + `<circle cx="16" cy="14" r="2.4" fill="#f6c945"/>`,
  f3: petals(16, 1.9, 6.5, 8, "#f0a530") + petals(12, 1.7, 4.2, 11, "#f6c945") + `<circle cx="16" cy="16" r="3" fill="#d9772f"/>`,
  f4: `<rect x="9" y="3" width="5" height="27" rx="2" fill="#3f8f4a"/><rect x="18" y="8" width="4" height="22" rx="2" fill="#5aa65e"/>`
    + `<path d="M9 11h5M9 20h5M18 15h4M18 23h4" stroke="#2c6a35" stroke-width="1.4"/>`
    + `<path d="M14 11q7-6 14-4q-6 5-14 4z" fill="#6fbf6a"/><path d="M18 17q-8-3-13 0q7 3 13 0z" fill="#4fa356"/>`,
  s1: `<rect x="6" y="26" width="20" height="4" rx="2" fill="#9a6b3f"/><path d="M16 27V14" stroke="#3f8f4a" stroke-width="2.2"/>`
    + `<path d="M16 19C9 19 5 14 5 9C11 9 16 13 16 19z" fill="#7cc46f"/><path d="M16 15C23 15 27 10 27 5C20 5 16 9 16 15z" fill="#4fa356"/>`,
  s2: `<g stroke="#e8902a" stroke-width="2.4" stroke-linecap="round">`
    + Array.from({ length: 8 }, (_, i) => `<path d="M16 2.5v4" transform="rotate(${i * 45} 16 16)"/>`).join("")
    + `</g><circle cx="16" cy="16" r="7.5" fill="#f6c945" stroke="#e8902a" stroke-width="1.5"/>`,
  s3: `<path d="M16 3L19 10L26 8L23 15L29 18L21 20L22 27L16 23L10 27L11 20L3 18L9 15L6 8L13 10Z" fill="#d9662b"/>`
    + `<path d="M16 31V9M16 20L10 14M16 20L22 14" stroke="#8a3a17" stroke-width="1.3" fill="none" stroke-linecap="round"/>`,
  s4: `<g stroke="#4a8fd6" stroke-width="2" stroke-linecap="round" fill="none">`
    + [0, 60, 120].map(a => `<g transform="rotate(${a} 16 16)"><path d="M16 3v26M16 7l-3.5-3M16 7l3.5-3M16 25l-3.5 3M16 25l3.5 3"/></g>`).join("")
    + `</g>`,
  cat: `<path d="M3.5 18.5h7M3.5 22l7-1.5M28.5 18.5h-7M28.5 22l-7-1.5" stroke="#8a6d3b" stroke-width=".9" stroke-linecap="round"/>`
    + `<path d="M7 12L8.5 3.5L14 9H18L23.5 3.5L25 12C27 15 27 22 22 26C19 28 13 28 10 26C5 22 5 15 7 12Z" fill="#e09a3e"/>`
    + `<path d="M9.5 6.5L13 9.5M22.5 6.5L19 9.5" stroke="#f3c98c" stroke-width="1.6" stroke-linecap="round"/>`
    + `<ellipse cx="12.5" cy="16" rx="1.7" ry="2.3" fill="#2b2b2b"/><ellipse cx="19.5" cy="16" rx="1.7" ry="2.3" fill="#2b2b2b"/>`
    + `<path d="M14.8 20h2.4L16 21.6z" fill="#c4456a"/><path d="M16 21.6q-1 1.6-2.6 1M16 21.6q1 1.6 2.6 1" stroke="#7a4a1a" stroke-width=".8" fill="none"/>`,
  rat: `<path d="M6 22C1 22 1 28 7 28S13 29 15 26" stroke="#c48a95" stroke-width="1.6" fill="none" stroke-linecap="round"/>`
    + `<path d="M5 23C5 16 11 12 17 12C22 12 25 15 29 20.5C27 22 24 23 20 23Z" fill="#9aa0a6"/>`
    + `<circle cx="19" cy="12" r="3.6" fill="#9aa0a6"/><circle cx="19" cy="12" r="2.1" fill="#e3b5bc"/>`
    + `<circle cx="24.5" cy="17.6" r="1.1" fill="#2b2b2b"/><circle cx="29" cy="20.5" r="1" fill="#c4456a"/>`
    + `<path d="M11 23v2.5M18 23v2.5" stroke="#c48a95" stroke-width="1.4" stroke-linecap="round"/>`,
  rooster: `<path d="M11 15C6 11 4 7 6 3.5C8 8 11 9.5 13 12M10 17C5 15 2.5 12 2.5 8.5" stroke="#2f7d6a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    + `<path d="M15 26V30M20 26V30M13 30h4M18 30h4" stroke="#e8a33d" stroke-width="1.6" stroke-linecap="round"/>`
    + `<path d="M9 15C9 22 13 26 18 26C24 26 26 21 25 16L23.5 10C22 7 18 7.5 18 11L18.5 15C15 15 12 13.5 9 15Z" fill="#f0e6d2" stroke="#8a6d3b" stroke-width=".8"/>`
    + `<path d="M18 8.2C17.6 5 19.6 4.6 20.2 6.6C20.4 3.6 23.2 3.8 22.6 6.6C24.6 5.8 25.6 8 23 9Z" fill="#d23b2a"/>`
    + `<path d="M25 10.5L28.5 11.8L25 13Z" fill="#e8a33d"/><ellipse cx="24.4" cy="15" rx="1.1" ry="1.9" fill="#d23b2a"/>`
    + `<circle cx="22.2" cy="11" r="1" fill="#2b2b2b"/>`,
  centipede: centipedeArt,
};
const SEAT_NO = { E: 1, S: 2, W: 3, N: 4 };
// Does this bonus tile score for the current seat? Animals always do; flowers and seasons only on your seat number.
const bonusScores = id => id.length > 2 || +id[1] === SEAT_NO[settings.seat];

function bonusTileEl(id, { small = false } = {}) {
  const [, name, group] = BONUS.find(b => b[0] === id);
  const el = document.createElement("span");
  el.className = "btile" + (small ? " small" : "");
  el.innerHTML = `<svg viewBox="0 0 32 32" aria-hidden="true">${BONUS_ART[id]}</svg>`
    + (group !== "a" ? `<span class="num ${group}">${id[1]}</span>` : "")
    + (bonusScores(id) ? `<span class="tai" title="Scores 1 tai for you">+1</span>` : "");
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", name);
  return el;
}
const ALL = [];
for (const s of "mps") for (let n = 1; n <= 9; n++) ALL.push(n + s);
for (let n = 1; n <= 7; n++) ALL.push(n + "z");
const order = t => ALL.indexOf(t);
const label = t => t[1] === "z" ? HONOR_NAMES[+t[0] - 1] : `${t[0]} ${SUIT_NAMES[t[1]]}`;

const blank = () => ({ hand: [], drawn: null, thrown: null, fromLeft: false, melds: [], seen: [], bonus: [], target: "hand" });
let state = blank();
let settings = { seat: "E", round: "E", minTai: 1, maxTai: 5, useJev: true };
const history = [];
try {
  const saved = JSON.parse(localStorage.getItem("mjcoach") || "null");
  if (saved && saved.state) { state = { ...blank(), ...saved.state }; settings = { ...settings, ...saved.settings }; }
} catch (e) {}

function save() { try { localStorage.setItem("mjcoach", JSON.stringify({ state, settings })); } catch (e) {} }
function change(fn) { history.push(JSON.stringify(state)); if (history.length > 100) history.shift(); fn(); render(); }

function meldTiles(m) {
  if (m.kind === "chow") { const n = +m.tile[0]; return [0,1,2].map(i => (n + i) + m.tile[1]); }
  return Array(m.kind === "kong" ? 4 : 3).fill(m.tile);
}
function known() {
  const k = {};
  const add = t => { k[t] = (k[t] || 0) + 1; };
  state.hand.forEach(add); state.seen.forEach(add); state.melds.flatMap(meldTiles).forEach(add);
  if (state.drawn) add(state.drawn); if (state.thrown) add(state.thrown);
  return k;
}
const baseSize = () => 13 - 3 * state.melds.length;

function tileEl(t, { small = false, big = false, key = false, left = null, onClick = null, title = null, hl = false } = {}) {
  const el = document.createElement(onClick ? "button" : "span");
  el.className = `tile ${t[1]}${t[1] === "z" ? " z" + t[0] : ""}${small ? " small" : ""}${big ? " big" : ""}${key ? " key" : ""}${hl ? " hl" : ""}`;
  el.innerHTML = t[1] === "z" ? `<b>${HONORS[+t[0] - 1]}</b>` : `<b>${t[0]}</b><i>${SUITS[t[1]]}</i>`;
  el.setAttribute("aria-label", label(t)); el.title = title || label(t);
  if (left !== null) { const s = document.createElement("span"); s.className = "left"; s.textContent = left; el.appendChild(s); if (left === 0) el.classList.add("dead"); }
  if (onClick) { el.type = "button"; el.addEventListener("click", onClick); }
  return el;
}

function render() {
  save();
  const k = known();
  // settings
  for (const [id, key] of [["seat","seat"],["round","round"],["minTai","minTai"],["maxTai","maxTai"]]) document.getElementById(id).value = settings[key];
  document.getElementById("useJev").checked = settings.useJev;
  document.getElementById("fromLeft").checked = state.fromLeft;
  // hand
  const hand = document.getElementById("hand"); hand.replaceChildren();
  [...state.hand].sort((a, b) => order(a) - order(b)).forEach(t =>
    hand.appendChild(tileEl(t, { onClick: () => change(() => state.hand.splice(state.hand.indexOf(t), 1)), title: `Remove ${label(t)}` })));
  const n = state.hand.length + (state.drawn ? 1 : 0);
  document.getElementById("handCount").textContent = `${state.hand.length}${state.drawn ? " + 1" : ""} / ${baseSize()}`
    + (n > baseSize() ? " · discard one" : "");
  const drawn = document.getElementById("drawn"); drawn.replaceChildren(state.drawn ? tileEl(state.drawn, { onClick: () => change(() => state.drawn = null), title: "Clear" }) : document.createTextNode("–"));
  const thrown = document.getElementById("thrown"); thrown.replaceChildren(state.thrown ? tileEl(state.thrown, { onClick: () => change(() => state.thrown = null), title: "Clear" }) : document.createTextNode("–"));
  // melds
  const melds = document.getElementById("melds"); melds.replaceChildren();
  state.melds.forEach((m, i) => {
    const box = document.createElement("span"); box.className = "meld";
    meldTiles(m).forEach(t => box.appendChild(tileEl(t, { small: true })));
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Remove meld";
    x.addEventListener("click", () => change(() => state.melds.splice(i, 1)));
    box.appendChild(x); melds.appendChild(box);
  });
  // bonus
  const bonus = document.getElementById("bonus"); bonus.replaceChildren();
  state.bonus.forEach(b => { const el = document.createElement("button"); el.className = "bonus-pick"; el.type = "button";
    el.title = `Remove ${BONUS.find(x => x[0] === b)[1]}`; el.appendChild(bonusTileEl(b, { small: true }));
    el.addEventListener("click", () => change(() => state.bonus.splice(state.bonus.indexOf(b), 1))); bonus.appendChild(el); });
  // tabs
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.target === state.target));
  // palette
  const pal = document.getElementById("palette"); pal.replaceChildren();
  const bp = document.getElementById("bonusPalette");
  pal.hidden = state.target === "bonus"; bp.hidden = state.target !== "bonus";
  for (const suit of ["m", "p", "s", "z"]) {
    const row = document.createElement("div"); row.className = "suit";
    ALL.filter(t => t[1] === suit).forEach(t => {
      const left = 4 - (k[t] || 0);
      const el = tileEl(t, { left, onClick: () => addTile(t) });
      if (left <= 0) el.disabled = true;
      row.appendChild(el);
    });
    pal.appendChild(row);
  }
  bp.replaceChildren();
  for (const [group, title] of [["f", "Flowers"], ["s", "Seasons"], ["a", "Animals (always +1)"]]) {
    const g = document.createElement("div"); g.className = "bonus-group";
    const h = document.createElement("h3"); h.textContent = title; g.appendChild(h);
    BONUS.filter(b => b[2] === group).forEach(([id, name]) => {
      const el = document.createElement("button"); el.className = "bonus-pick"; el.type = "button";
      el.appendChild(bonusTileEl(id)); el.appendChild(document.createTextNode(name.replace("Chrysanthemum", "Chrysan­themum")));
      el.disabled = state.bonus.includes(id);
      el.addEventListener("click", () => change(() => state.bonus.push(id)));
      g.appendChild(el);
    });
    bp.appendChild(g);
  }
  const hint = document.getElementById("bonusHint");
  hint.hidden = state.target !== "bonus";
  hint.textContent = `As ${({E: "East", S: "South", W: "West", N: "North"})[settings.seat]} seat, flower `
    + `${SEAT_NO[settings.seat]} and season ${SEAT_NO[settings.seat]} score for you. `
    + `A full set of four flowers or four seasons scores 2.`;
  // seen
  document.getElementById("seenCount").textContent = state.seen.length;
  const seen = document.getElementById("seen"); seen.replaceChildren();
  state.seen.forEach((t, i) => seen.appendChild(tileEl(t, { small: true, onClick: () => change(() => state.seen.splice(i, 1)), title: `Remove ${label(t)}` })));
  scheduleAdvice();
}

function addTile(t) {
  change(() => {
    switch (state.target) {
      case "hand":
        if (state.hand.length < baseSize()) state.hand.push(t);
        if (state.hand.length >= baseSize()) state.target = "drawn";  // hand full: next is a draw or a throw
        break;
      case "drawn": state.drawn = t; state.thrown = null; break;
      case "thrown": state.thrown = t; state.drawn = null; break;
      case "seen": state.seen.push(t); break;
    }
  });
}

let timer = null, seq = 0;
function scheduleAdvice() { clearTimeout(timer); timer = setTimeout(fetchAdvice, 120); }

async function fetchAdvice() {
  const box = document.getElementById("advice");
  const n = state.hand.length + (state.drawn ? 1 : 0);
  if (state.hand.length < baseSize()) {
    seq++;
    idle(state.hand.length ? `${state.hand.length} OF ${baseSize()} TILES` : "START HERE",
         state.hand.length ? "Keep tapping your tiles below. Tap one in your hand to take it back."
                           : `Tap your ${baseSize()} tiles below.`);
    return;
  }
  const payload = {
    hand: state.hand, drawn: state.drawn, thrown: state.thrown, from_left: state.fromLeft,
    melds: state.melds, seen: state.seen, bonus: state.bonus,
    seat_wind: settings.seat, round_wind: settings.round, min_tai: settings.minTai, max_tai: settings.maxTai,
    use_jev: settings.useJev,
  };
  const my = ++seq;
  box.style.opacity = .6;
  try {
    const res = await fetch("/api/advise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (my !== seq) return;
    box.style.opacity = 1;
    if (!res.ok) { idle("CHECK YOUR TILES", data.error, true); return; }
    renderAdvice(data);
  } catch (e) {
    if (my !== seq) return;
    box.style.opacity = 1;
    idle("OFFLINE", "Can't reach the coach server. Is it still running?", true);
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function idle(kicker, text, isError = false) {
  const box = document.getElementById("advice");
  box.className = "hero idle"; box.replaceChildren(el("div", "kicker", kicker), el("p", isError ? "err" : "why", text));
}

function needsEl(needs) {
  const wrap = document.createElement("div"); wrap.className = "needs";
  needs.forEach(nd => {
    const el = document.createElement("span"); el.className = "need";
    el.appendChild(tileEl(nd.tile, { small: true, left: nd.live }));
    const txt = document.createElement("span");
    if (nd.live === 0) txt.textContent = "gone";
    else if (nd.tai_self_drawn !== undefined) {
      txt.className = nd.pays ? "pay" : "nopay";
      txt.textContent = nd.pays_on_discard ? `${nd.tai} tai` : nd.pays ? `${nd.tai_self_drawn} tai, self-draw only` : `${nd.tai_self_drawn} tai, won't pay`;
    } else if (nd.pays === true) { txt.className = "pay"; txt.textContent = "pays"; }
    else if (nd.pays === false) { txt.className = "nopay"; txt.textContent = "won't pay"; }
    el.appendChild(txt); wrap.appendChild(el);
  });
  return wrap;
}

const VERB = { discard: "Discard", pass: "Pass", win: "Win!", pong: "Pong", kong: "Kong", chow: "Chow" };
// Short name for a tile in button text: the character for honours, words for suited tiles.
const tileWord = t => t[1] === "z" ? HONORS[+t[0] - 1] : label(t);

function actionButton(o, { primary = false, quiet = false } = {}) {
  const b = el("button", "btn" + (primary ? " primary" : "") + (quiet ? " quiet" : ""));
  b.type = "button";
  switch (o.action) {
    case "discard": b.textContent = `Discard ${tileWord(o.tile)}`; b.onclick = () => change(() => {
        const all = [...state.hand, ...(state.drawn ? [state.drawn] : [])];
        all.splice(all.indexOf(o.tile), 1); state.hand = all; state.drawn = null; state.seen.push(o.tile); state.target = "thrown"; }); break;
    case "pass": b.textContent = "Pass"; b.onclick = () => change(() => { state.seen.push(state.thrown); state.thrown = null; }); break;
    case "win": b.textContent = "Won! New hand"; b.onclick = () => change(() => { state = blank(); }); break;
    default: {
      const m = o.meld.tile;
      b.textContent = o.action === "chow" ? `Chow ${m[0]}${+m[0] + 1}${+m[0] + 2} ${SUIT_NAMES[m[1]]}` : `${VERB[o.action]} ${tileWord(o.tile)}`;
      b.onclick = () => change(() => { o.uses.forEach(t => state.hand.splice(state.hand.indexOf(t), 1));
        state.melds.push({ kind: o.meld.kind, tile: o.meld.tile }); state.thrown = null; state.target = o.action === "kong" ? "drawn" : "hand"; });
    }
  }
  return b;
}

// Tiles shown big in the best-move card; the one the move is about gets the red edge.
function heroTiles(o, r) {
  switch (o.action) {
    case "discard": return [[o.tile, true]];
    case "pass": return [[o.tile, false]];
    case "pong": return [[o.tile, false], [o.tile, false], [o.tile, true]];
    case "kong": return [[o.tile, false], [o.tile, false], [o.tile, false], [o.tile, true]];
    case "chow": return meldTiles(o.meld).map(t => [t, t === o.tile]);
    case "win": { const t = r.thrown || state.drawn; return t ? [[t, true]] : []; }
  }
  return [];
}

function heroSub(o) {
  switch (o.action) {
    case "discard": return o.label;
    case "pong": case "chow": return `then discard ${o.then_discard_label}`;
    case "kong": return "then draw a replacement tile";
    case "pass": return `let the ${tileWord(o.tile)} go`;
    case "win": return `${o.score.tai} tai${o.score.meets_minimum ? "" : " · below the minimum"}`;
  }
  return "";
}

function decidedBadge(r) {
  if (!r.decided_by) return null;
  const jev = r.decided_by.source === "jev";
  return el("span", "badge" + (jev ? " jev" : ""), jev
    ? `Picked by Jev${r.decided_by.confidence != null ? ` · ${Math.round(r.decided_by.confidence * 100)}% sure` : ""}${r.decided_by.agrees_with_engine ? "" : " · engine disagrees"}`
    : r.decided_by.note);
}

function watchEl(needs, text) {
  const w = el("div", "watch");
  w.appendChild(el("span", "label", text));
  w.appendChild(needsEl(needs.slice(0, 8)));
  return w;
}

function renderAdvice(r) {
  const box = document.getElementById("advice");
  box.className = "hero"; box.replaceChildren();
  const add = (...xs) => xs.forEach(x => x && box.appendChild(x));

  if (r.mode === "waiting") {
    add(el("div", "kicker", r.shanten === 0 ? "READY" : "BUILDING"),
        el("h2", "verb", r.shanten === 0 ? "Ready" : `${r.shanten} away`),
        el("p", "sub", r.shanten === 0 ? "one tile from winning" : `${r.shanten === 1 ? "one step" : r.shanten + " steps"} from a ready hand`),
        el("div", "rule"), el("p", "why", r.summary));
    if (r.needs.length) add(watchEl(r.needs, "Watch for"));
    (r.warnings || []).forEach(w => add(el("div", "warn", w)));
    return;
  }

  const best = r.options.find(o => o.recommended) || r.options[0];
  add(el("div", "kicker", "BEST MOVE"));
  const tiles = el("div", "tiles");
  heroTiles(best, r).forEach(([t, key]) => tiles.appendChild(tileEl(t, { big: true, key })));
  add(tiles, el("h2", "verb", VERB[best.action]), el("p", "sub", heroSub(best)), el("div", "rule"));
  add(el("p", "why", best.reason && best.action !== "pass" ? best.reason : best.summary));
  if (best.score) add(el("p", "muted", best.score.items.map(i => `${i.name} ${i.tai}`).join(" · ")));
  if (best.needs && best.needs.length) add(watchEl(best.needs, best.action === "pass" ? "Still watching for" : "Then watch for"));
  (r.warnings || []).forEach(w => add(el("div", "warn", w)));
  add(decidedBadge(r));

  const others = r.options.filter(o => o !== best);
  const alt = r.mode === "call" ? (others.find(o => o.action === "pass") || others[0]) : others[0];
  const cta = el("div", "cta");
  if (alt) cta.appendChild(actionButton(alt));
  cta.appendChild(actionButton(best, { primary: true }));
  add(cta);

  if (others.length) {
    const d = el("details", "others");
    d.appendChild(el("summary", null, `Other options (${others.length})`));
    others.slice(0, 6).forEach(o => {
      const row = el("div", "opt"), top = el("div", "opt-top"), title = el("div", "opt-title");
      if (o.tile && o.action !== "win") title.appendChild(tileEl(o.tile, { small: true }));
      title.appendChild(el("span", null, (o.action === "discard" ? `Discard ${o.label}` : VERB[o.action])
        + (o.engine_pick ? " · engine's pick" : "")));
      if (o.jev_probability != null) title.appendChild(el("span", "badge", `Jev ${Math.round(o.jev_probability * 100)}%`));
      top.append(title, actionButton(o, { quiet: true }));
      row.append(top, el("div", "muted", o.summary));
      if (o.needs && o.needs.length) row.appendChild(needsEl(o.needs.slice(0, 8)));
      d.appendChild(row);
    });
    add(d);
  }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => change(() => state.target = b.dataset.target)));
document.getElementById("fromLeft").addEventListener("change", e => change(() => state.fromLeft = e.target.checked));
for (const [id, key, num] of [["seat","seat",false],["round","round",false],["minTai","minTai",true],["maxTai","maxTai",true]])
  document.getElementById(id).addEventListener("change", e => { settings[key] = num ? +e.target.value : e.target.value; render(); });
document.getElementById("useJev").addEventListener("change", e => { settings.useJev = e.target.checked; render(); });
document.getElementById("undo").addEventListener("click", () => { if (history.length) { state = JSON.parse(history.pop()); render(); } });
document.getElementById("reset").addEventListener("click", () => change(() => { state = blank(); }));
fetch("/api/status").then(r => r.json()).then(s => {
  document.getElementById("engine").textContent = s.jev_configured ? "Singapore rules · Jev on" : "Singapore rules · Jev off";
}).catch(() => {});
render();
</script>
</body>
</html>
